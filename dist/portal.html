<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3ea" />
    <meta name="description" content="CivicShift volunteer coordination portal for students, nonprofits, administrators, and school counselors." />
    <title>CivicShift Portal</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="portal.css" />
    <script src="portal-boot.js"></script>
    <script type="module" src="portal.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <div id="app" aria-live="polite"></div>
    <div class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title">
      <form method="dialog">
        <button class="icon-button dialog-x" value="cancel" aria-label="Close dialog">×</button>
        <div id="dialog-content"></div>
      </form>
    </dialog>
    <noscript><p class="noscript">CivicShift requires JavaScript for scheduling and account tools.</p></noscript>
  </body>
</html>
